<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/badge-test.webmanifest">
<title>HOYDALAR Badge Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7fb;color:#17233d}.wrap{max-width:560px;margin:0 auto;padding:32px 18px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 34px rgba(20,35,60,.10)}h1{margin:0 0 10px;font-size:28px}.muted{color:#6f7b90;line-height:1.45}.status{margin:18px 0;padding:14px;border-radius:14px;background:#f4f7fb;font-weight:700;white-space:pre-wrap}button{width:100%;border:0;border-radius:14px;padding:15px 16px;margin-top:10px;font-size:16px;font-weight:800}.primary{background:#17233d;color:#fff}.secondary{background:#e9edf4;color:#17233d}.danger{background:#fff0f0;color:#a12222}</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>HOYDALAR badge test</h1>
<p class="muted">Denne side er kun til test. Læg den på hjemmeskærmen og åbn den derfra.</p>
<div id="status" class="status">Klar til test.</div>
<button class="primary" id="permission">1. Tillad notifikationer</button>
<button class="secondary" id="setbadge">2. Vis badge 1</button>
<button class="danger" id="clearbadge">Nulstil badge</button>
</div></div>
<script>
const statusEl=document.getElementById('status');
function show(msg){statusEl.textContent=msg;}
function displayMode(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
show('Installeret som webapp: '+(displayMode()?'JA':'NEJ')+'\nNotifikationstilladelse: '+(typeof Notification!=='undefined'?Notification.permission:'ikke tilgængelig')+'\nBadging API: '+(('setAppBadge' in navigator)?'JA':'NEJ'));
document.getElementById('permission').onclick=async()=>{
 try{
  if(typeof Notification==='undefined'){show('Notifications API er ikke tilgængelig. Åbn siden fra hjemmeskærmen.');return;}
  const p=await Notification.requestPermission();
  show('Notifikationstilladelse: '+p+'\nBadging API: '+(('setAppBadge' in navigator)?'JA':'NEJ'));
 }catch(e){show('Fejl ved tilladelse: '+e.message);}
};
document.getElementById('setbadge').onclick=async()=>{
 try{
  if(!('setAppBadge' in navigator)){show('Badging API er ikke tilgængelig. Sørg for at siden er åbnet fra hjemmeskærmen.');return;}
  await navigator.setAppBadge(1);
  show('Badge er sat til 1. Gå til hjemmeskærmen og se på ikonet.');
 }catch(e){show('Kunne ikke sætte badge: '+e.message);}
};
document.getElementById('clearbadge').onclick=async()=>{
 try{
  if('clearAppBadge' in navigator) await navigator.clearAppBadge();
  show('Badge er nulstillet.');
 }catch(e){show('Kunne ikke nulstille badge: '+e.message);}
};
</script>
</body>
</html>
