name: Fix calendar Helge detail
on:
  push:
    paths:
      - '.github/workflows/fix-calendar-helge.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include orchestra training in calendar details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const training=crew.filter(x=>x.role==='Spíri'&&/spíri træning/i.test(String(x.activity||''))).sort((a,b)=>(a.start||'').localeCompare(b.start||''));"
          new="const training=crew.filter(x=>x.role==='Spíri'&&/(spíri træning|træning med orkester)/i.test(String(x.activity||''))).sort((a,b)=>(a.start||'').localeCompare(b.start||''));"
          if old not in s:
              raise SystemExit('calendar training filter target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'HOYDALAR Portal Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Show Spíri orchestra training in calendar details'
          git push
