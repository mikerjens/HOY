name: Run calendar consistency fixer
on:
  push:
    paths:
      - '.github/workflows/run-calendar-fixer.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: node tools/fix-calendar-consistency.js
      - name: Commit changes
        run: |
          git config user.name 'HOYDALAR Portal Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html netlify/functions/portal-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Correct early Week calendar consistency'
            git push
          fi
