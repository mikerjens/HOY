name: Update contact page
on:
  push:
    paths:
      - '.github/workflows/update-contact.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<section class="page" id="contact"><div class="page-title"><h1>KONTAKT</h1></div><div class="simple"><div class="empty">Kommer senere</div></div></section>'
          new = '''<section class="page" id="contact"><div class="page-title"><h1>KONTAKT</h1></div><div class="simple" style="max-width:680px"><div style="font-size:12px;font-weight:950;letter-spacing:.07em;text-transform:uppercase;color:#647188;margin-bottom:8px">Line Producer</div><div style="font-size:24px;font-weight:1000;margin-bottom:14px">Michael Koba</div><div class="contact-links" style="margin-top:0"><a href="tel:+298591011">☎ +298 591011</a><a href="mailto:mk@fixer.fo">✉ mk@fixer.fo</a></div><div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:#53627a;font-size:13px;font-weight:800;line-height:1.5">Kontakt Michael ved spørgsmål om kalender, mødetider, vagter, ændringer i planen, locations og praktiske aftaler omkring produktionen.</div></div></section>'''
          if old not in s:
              raise SystemExit('Old contact section not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name 'HOYDALAR Portal Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Update contact page with line producer details'
          git push
