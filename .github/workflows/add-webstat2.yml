name: Add Web Stat
on:
  push:
    paths:
      - ".github/workflows/add-webstat2.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tracker
        shell: bash
        run: |
          TRACKER=''
          export TRACKER
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          snippet=base64.b64decode(os.environ['TRACKER']).decode()
          for name in ('index.html','catering.html'):
              p=Path(name)
              s=p.read_text()
              if 'wts1559245' not in s:
                  p.write_text(s.replace('</body>', snippet+'\n</body>'))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "HOYDALAR Portal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html catering.html
          if ! git diff --cached --quiet; then
            git commit -m "Add Web-Stat tracking to portal"
            git push
          fi