name: Add catering navigation
on:
  push:
    paths:
      - '.github/workflows/add-catering-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Catering buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if "location.href='/catering.html'" not in s:
              desktop='''<button data-page="calendar"><svg class="nav-icon" aria-hidden="true"><use href="#i-calendar"/></svg><span>KALENDER</span></button>'''
              desktop_new=desktop+'\n'+'''<button onclick="location.href='/catering.html'"><span style="font-size:19px;line-height:1">🍽</span><span>CATERING</span></button>'''
              if desktop not in s:
                  raise SystemExit('Desktop calendar anchor not found')
              s=s.replace(desktop,desktop_new,1)
              mobile='''<button class="more-link" data-page="people"><svg class="nav-icon" aria-hidden="true"><use href="#i-team"/></svg><div>TEAM<small>Se hele holdet og roller</small></div><span>›</span></button>'''
              mobile_new='''<button class="more-link" onclick="location.href='/catering.html'"><span style="font-size:21px;line-height:1">🍽</span><div>CATERING<small>Kuverter og madoversigt</small></div><span>›</span></button>\n'''+mobile
              if mobile not in s:
                  raise SystemExit('Mobile more anchor not found')
              s=s.replace(mobile,mobile_new,1)
              p.write_text(s)
          PY
      - name: Commit portal navigation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HOYDALAR Portal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Catering button to portal"
          git push
