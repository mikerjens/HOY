<style>
:root{--ink:#17233d;--muted:#728096;--line:#e8edf3;--pink:#b1124d;--pink2:#df4b7d;--green:#55b72f;--blue:#3f8efc;--shadow:0 14px 35px rgba(30,45,80,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff 0%,#fff9fb 55%,#f8fbff 100%)}button{font:inherit;cursor:pointer}.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.brand{font-size:25px;font-weight:1000}.brand span{color:var(--pink)}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;color:var(--ink)}h1{font-size:34px;margin:0 0 7px}.lead{margin:0 0 20px;color:var(--muted);font-weight:700;line-height:1.45}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{border:1px solid #ead6df;background:#fff;color:var(--ink);border-radius:999px;padding:11px 15px;font-weight:950}.tab.active{color:#fff;border-color:transparent;background:linear-gradient(100deg,var(--pink),var(--pink2))}.share{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow);font-size:13px;color:var(--muted);font-weight:750}.share strong{display:block;color:var(--ink);margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.card.optag{border-top:5px solid var(--blue)}.card.other{border-top:5px solid var(--green)}.date{font-size:13px;font-weight:1000;color:#6a7589;text-transform:uppercase}.type{font-size:19px;font-weight:1000;margin:5px 0 13px}.primary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.primary-box{border-radius:16px;padding:14px 15px;background:#fff5f8;border:1px solid #f3ccda}.primary-box.delivery{background:#eef7ff;border-color:#d5e8ff}.primary-box small{display:block;font-size:10px;font-weight:1000;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.primary-box strong{display:block;font-size:30px;line-height:1.05;font-weight:1000;color:var(--pink)}.primary-box.delivery strong{color:#245fa8}.primary-box span{display:block;margin-top:4px;font-size:11px;font-weight:850;color:#657187}.count{display:flex;align-items:flex-end;gap:8px;margin:10px 0}.count strong{font-size:38px;line-height:1;color:var(--pink)}.count span{font-weight:950;color:#5f6c82;padding-bottom:3px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.fact{border:1px solid var(--line);background:#fbfcfe;border-radius:12px;padding:10px}.fact small{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase}.fact b{display:block;margin-top:4px;font-size:13px}.note{margin-top:13px;color:#5d6a80;font-size:12px;line-height:1.45;font-weight:700}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}.stamp{font-size:11px;color:var(--muted);font-weight:800;margin-top:18px;text-align:right}@media(max-width:700px){.wrap{padding:18px 12px 40px}.top{align-items:flex-start}.brand{font-size:22px}h1{font-size:29px}.grid{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:11px 8px;font-size:12px}.facts{grid-template-columns:1fr 1fr}.primary{grid-template-columns:1fr 1fr}.primary-box strong{font-size:27px}}

<body><main class="wrap"><div class="top"><div class="brand">HOYDALAR <span>2</span></div><button class="back" onclick="location.href='/'">← Portal</button></div><h1>CATERING</h1><p class="lead" id="lead">Indlæser cateringoversigt…</p><div class="tabs"><button class="tab" id="allTab">ALLE DAGE · JONNA</button><button class="tab" id="hafniaTab">OPTAGEDAGE · HAFNIA</button></div><div class="share" id="shareBox"></div><section class="grid" id="cards"><div class="empty">Indlæser…</div></section><div class="stamp" id="stamp"></div></main>
<script>
const MASTER='1uD5fjFA4GW6bYtYaxCgaGB0h-FVBbp8p3ialzJpOhyY';
const $=s=>document.querySelector(s);
let rows=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clean(s){return String(s||'').replace(/\bstjernen\b/gi,'gæsten').replace(/\bstjerner\b/gi,'gæster').replace(/\bstjerne\b/gi,'gæst')}
function parseCsv(text){const out=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(v);v='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);v='';if(row.some(x=>String(x).trim()!==''))out.push(row);row=[];continue}v+=c}if(v||row.length){row.push(v);if(row.some(x=>String(x).trim()!==''))out.push(row)}return out}
function deliveryTime(value){const m=String(value||'').match(/(\d{1,2}):(\d{2})/);if(!m)return'Afklares';let mins=Number(m[1])*60+Number(m[2])-30;if(mins<0)mins+=1440;return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`}
function isHafnia(){return new URLSearchParams(location.search).get('view')==='hafnia'}
function setView(hafnia,push=true){if(push){const u=new URL(location.href);if(hafnia)u.searchParams.set('view','hafnia');else u.searchParams.delete('view');history.replaceState(null,'',u)}$('#allTab').classList.toggle('active',!hafnia);$('#hafniaTab').classList.toggle('active',hafnia);$('#lead').textContent=hafnia?'Hafnia Hotel · kun optagedage. Antal kuverter og leveringstid står tydeligt øverst på hvert kort.':'Jonna · samlet overblik over alle dage med catering.';$('#shareBox').innerHTML=hafnia?'<strong>Hafnia-visning</strong>Viser kun optagedagene. Maden skal være fremme senest 30 minutter før spisepausen.':'<strong>Jonna-visning</strong>Her vises alle cateringdage. Optagedage leveres af Hafnia Hotel; øvrige dage håndteres af Jonna.';render(hafnia)}
function render(hafnia){const data=rows.filter(r=>!hafnia||/optagedag/i.test(r.dayType));$('#cards').innerHTML=data.length?data.map(r=>{const opt=/optagedag/i.test(r.dayType),count=r.finalCount||r.approx||'Afklares',supplier=opt?'Hafnia Hotel':'Jonna',delivery=opt?deliveryTime(r.time):'';const note=hafnia?'Leveringstid er sat 30 minutter før den planlagte spisepause.':clean(r.note);if(hafnia)return `<article class="card optag"><div class="date">${esc(r.date)}</div><div class="type">${esc(r.dayType)}</div><div class="primary"><div class="primary-box"><small>Antal kuverter</small><strong>${esc(count)}</strong><span>${r.finalCount?'Endeligt antal':'Aktuelt antal'}</span></div><div class="primary-box delivery"><small>Levering senest</small><strong>${esc(delivery)}</strong><span>30 min. før pausen</span></div></div><div class="facts"><div class="fact"><small>Spisepause</small><b>${esc(r.time||'Afklares')}</b></div><div class="fact"><small>Leverandør</small><b>Hafnia Hotel</b></div></div>${note?`<div class="note">${esc(note)}</div>`:''}</article>`;return `<article class="card ${opt?'optag':'other'}"><div class="date">${esc(r.date)}</div><div class="type">${esc(r.dayType)}</div><div class="count"><strong>${esc(count)}</strong><span>kuverter</span></div><div class="facts"><div class="fact"><small>Måltid</small><b>${esc(r.meal||'Afklares')}</b></div><div class="fact"><small>Tid</small><b>${esc(r.time||'Afklares')}</b></div><div class="fact"><small>Leverandør</small><b>${esc(supplier)}</b></div><div class="fact"><small>Status antal</small><b>${r.finalCount?'Endeligt':'Aktuelt'}</b></div></div>${note?`<div class="note">${esc(note)}</div>`:''}</article>`}).join(''):'<div class="empty">Ingen cateringdage i denne visning.</div>'}
async function load(){try{const u=`https://docs.google.com/spreadsheets/d/${MASTER}/gviz/tq?tqx=out:csv&sheet=CATERING&range=A4:I100&headers=0&_=${Date.now()}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Kunne ikke hente CATERING');let a=parseCsv(await r.text());if(a[0]&&String(a[0][0]).trim()==='Dato')a=a.slice(1);rows=a.map(x=>({date:String(x[0]||'').trim(),dayType:String(x[1]||'').trim(),meal:String(x[2]||'').trim(),time:String(x[3]||'').trim(),approx:String(x[4]||'').trim(),hot:String(x[5]||'').trim(),cold:String(x[6]||'').trim(),note:String(x[7]||'').trim(),finalCount:String(x[8]||'').trim()})).filter(x=>x.date&&x.dayType);setView(isHafnia(),false);$('#stamp').textContent='Opdateret '+new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})}catch(e){$('#cards').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$('#allTab').onclick=()=>setView(false);$('#hafniaTab').onclick=()=>setView(true);load();setInterval(load,60000);
</script><!-- begin Web-Stat code v 7.0 -->
