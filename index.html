<script>
const MASTER='1uD5fjFA4GW6bYtYaxCgaGB0h-FVBbp8p3ialzJpOhyY';
let DATA={people:[],shifts:[],program:[],today:''};let MESSAGES=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showPage(id){$$('.page').forEach(x=>x.classList.toggle('active',x.id===id));$$('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));$('#mobileMenu').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});if(id==='mine')renderMine();if(id==='all')renderAll();if(id==='calendar')renderCalendar();if(id==='people')renderPeople();if(id==='messages')renderMessages()}
$$('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));$('#menuBtn').addEventListener('click',()=>$('#mobileMenu').classList.toggle('open'));
function parseDate(s){const p=String(s||'').split('-').map(Number);return p.length===3&&p.every(Boolean)?new Date(p[0],p[1]-1,p[2]):new Date(s)}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateParts(s){const d=parseDate(s);return {wd:d.toLocaleDateString('da-DK',{weekday:'short'}).replace('.','').toUpperCase(),day:d.getDate(),mon:d.toLocaleDateString('da-DK',{month:'short'}).replace('.','').toUpperCase(),long:d.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'})}}
function shiftTime(x){return x.start&&x.end?`${x.start} · ${x.end}`:x.start?x.start:'Tid afventer'}
function renderMine(){const name=$('#nameSelect').value;if(!name){$('#mineContent').innerHTML='<div class="empty">Vælg dit navn øverst.</div>';return}const list=DATA.shifts.filter(x=>x.person===name).sort((a,b)=>parseDate(a.date)-parseDate(b.date)||(a.start||'').localeCompare(b.start||''));$('#mineContent').innerHTML=list.length?`<div class="person-schedule">${list.map(x=>`<div class="person-item"><strong>${esc(dateParts(x.date).long)}</strong><span>${esc(x.activity||x.task||'Vagt')}</span><b>${esc(shiftTime(x))}${x.location?' · '+esc(x.location):''}</b></div>`).join('')}</div>`:'<div class="empty">Ingen kommende vagter.</div>'}
function roleGroup(role){const r=String(role||'').toLowerCase();if(/foto|fotograf|kamera|ljós/.test(r))return'Foto / lys';if(/ljóð|lyd|ccu/.test(r))return'Lyd';if(/sang|orkester|musik|tónleikari|kapell/.test(r))return'Musik';if(/klip|color|post/.test(r))return'Post';if(/framleið|producer|produktion|tilrettel|samskip/.test(r))return'Produktion';if(/^spíri$/i.test(String(role||'').trim()))return'Spírar';return'Øvrige'}
function isMissing(x){return /^mangler person/i.test(String(x.person||''))||/mangler bemanding/i.test(String(x.status||''))}
function callSheetHtml(date,program,crew){const p=dateParts(date),first=program[0]||{};const start=program.map(x=>x.start).filter(Boolean).sort()[0]||crew.map(x=>x.start).filter(Boolean).sort()[0]||'Afventer';const end=program.map(x=>x.end).filter(Boolean).sort().slice(-1)[0]||crew.map(x=>x.end).filter(Boolean).sort().slice(-1)[0]||'Afventer';const location=first.location||crew.find(x=>x.location)?.location||'Afventer';const type=[first.part,first.dayType].filter(Boolean).join(' · ')||crew[0]?.activity||'Produktionsdag';const realCrew=crew.filter(x=>!isMissing(x)),missing=crew.filter(isMissing);const timeline=program.length?program.map(x=>`<div class="timeline-row"><div class="timeline-time">${esc(x.start||'')}${x.end?' · '+esc(x.end):''}</div><div><div class="timeline-act">${esc(x.activity||'')}</div>${x.responsible||x.participants?`<div class="timeline-sub">${x.responsible?'Ansvarlig: '+esc(x.responsible):''}${x.responsible&&x.participants?' · ':''}${x.participants?esc(x.participants):''}</div>`:''}</div></div>`).join(''):'<div class="empty">Intet dagsprogram endnu.</div>';const groups={};realCrew.forEach(x=>{const g=roleGroup(x.role);(groups[g]??=[]).push(x)});const crewHtml=Object.keys(groups).sort().map(g=>`<div class="crew-group"><h4>${esc(g)}</h4><div class="crew-list">${groups[g].map(x=>`<span class="crew-chip">${esc(x.person)}${x.start?`<span class="crew-time">${esc(x.start)}</span>`:''}</span>`).join('')}</div></div>`).join('')||'<div class="empty">Ingen tilknyttede endnu.</div>';const miss=missing.length?`<div class="section-label">Mangler bemanding</div><div class="alerts">${missing.map(x=>`<div class="alert"><strong>${esc(x.person.replace(/^MANGLER PERSON ·\s*/i,''))}</strong>${esc(x.task||x.role||'Skal bemandes')}</div>`).join('')}</div>`:'';return `<article class="call-card" data-call="${esc(date)}"><button class="call-summary"><div class="call-top"><div class="call-date"><small>${esc(p.wd)}</small><strong>${p.day}</strong><em>${esc(p.mon)}</em></div><div><div class="call-name">${esc(type)}</div><div class="call-meta">${esc(location)} · ${realCrew.length} på job${missing.length?` · ${missing.length} mangler`:''}</div></div><span class="call-open">SE DAGEN</span></div></button><div class="call-body"><div class="facts"><div class="fact"><small>Start</small><strong>${esc(start)}</strong></div><div class="fact"><small>Slut</small><strong>${esc(end)}</strong></div><div class="fact"><small>Location</small><strong>${esc(location)}</strong></div></div><div class="section-label">Dagens program</div><div class="timeline">${timeline}</div><div class="section-label">På job i dag</div><div class="crew-groups">${crewHtml}</div>${miss}</div></article>`}
function bindCalls(){$$('.call-summary').forEach(b=>b.addEventListener('click',()=>{const c=b.closest('.call-card'),open=!c.classList.contains('open');$$('.call-card').forEach(x=>x.classList.remove('open'));if(open)c.classList.add('open')}))}
function renderAll(openDate=''){const dates=[...new Set([...DATA.program.map(x=>x.date),...DATA.shifts.map(x=>x.date)])].filter(Boolean).sort();$('#allContent').innerHTML=dates.length?dates.map(d=>callSheetHtml(d,DATA.program.filter(x=>x.date===d).sort((a,b)=>(a.start||'').localeCompare(b.start||'')),DATA.shifts.filter(x=>x.date===d).sort((a,b)=>roleGroup(a.role).localeCompare(roleGroup(b.role))||a.person.localeCompare(b.person)))).join(''):'<div class="empty">Ingen kommende produktionsdage.</div>';bindCalls();if(openDate){const c=document.querySelector(`[data-call="${openDate}"]`);if(c){c.classList.add('open');setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'start'}),50)}}}
function renderHome(){const name=$('#nameSelect').value;const my=name?DATA.shifts.filter(x=>x.person===name).sort((a,b)=>parseDate(a.date)-parseDate(b.date)||(a.start||'').localeCompare(b.start||''))[0]:null;if(my)$('#myNext').innerHTML=`<div class="focus-kicker">Min næste vagt</div><div class="focus-title">${esc(dateParts(my.date).long)}</div><div class="focus-meta">${esc(shiftTime(my))} · ${esc(my.location||'Location afventer')}<br>${esc(my.activity||my.task||'Vagt')}</div><button class="focus-action" data-home-go="mine">SE MIT SKEMA</button>`;else $('#myNext').innerHTML=`<div class="focus-kicker">Mit skema</div><div class="focus-title">${name?'Ingen kommende vagter':'Vælg dit navn'}</div><div class="focus-meta">${name?'Der er ikke registreret flere vagter.':'Så viser vi din næste vagt her.'}</div>`;const pd=[...new Set(DATA.program.map(x=>x.date).filter(Boolean))].sort()[0];if(pd){const p=DATA.program.filter(x=>x.date===pd).sort((a,b)=>(a.start||'').localeCompare(b.start||'')),f=p[0]||{};$('#nextDay').innerHTML=`<div class="focus-kicker">Næste produktionsdag</div><div class="focus-title">${esc(dateParts(pd).long)}</div><div class="focus-meta">${esc([f.part,f.dayType].filter(Boolean).join(' · ')||'Produktionsdag')}<br>${esc(p.map(x=>x.start).filter(Boolean).sort()[0]||'Afventer')} · ${esc(p.map(x=>x.end).filter(Boolean).sort().slice(-1)[0]||'Afventer')} · ${esc(f.location||'Aulan, Hoydalar')}</div><button class="focus-action" data-open-date="${esc(pd)}">SE CALL SHEET</button>`}else $('#nextDay').innerHTML='<div class="focus-kicker">Næste produktionsdag</div><div class="focus-title">Ingen kommende dage</div>';const missing=DATA.shifts.filter(isMissing).slice(0,3);$('#alerts').innerHTML=missing.length?missing.map(x=>`<div class="alert"><strong>${esc(x.person.replace(/^MANGLER PERSON ·\s*/i,''))}</strong>${esc(dateParts(x.date).long)} · ${esc(x.task||x.role||'Mangler bemanding')}</div>`).join(''):'';renderHomeMessages();$$('[data-home-go]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.homeGo)));$$('[data-open-date]').forEach(b=>b.addEventListener('click',()=>{showPage('all');renderAll(b.dataset.openDate)}))}
function eventType(dayType,activity){const s=(String(dayType||'')+' '+String(activity||'')).toLowerCase();if(/prøve|træning/.test(s))return'pr';if(/optag/.test(s))return'op';return'other'}
function renderCalendar(){const year=2026,month=8,first=new Date(year,month,1),last=new Date(year,month+1,0),monday=(first.getDay()+6)%7,cells=[];for(let i=0;i<monday;i++)cells.push({date:new Date(year,month,1-monday+i),out:true});for(let n=1;n<=last.getDate();n++)cells.push({date:new Date(year,month,n),out:false});while(cells.length%7)cells.push({date:new Date(year,month,last.getDate()+(cells.length-(monday+last.getDate()))+1),out:true});const html=c=>{const key=ymd(c.date),p=DATA.program.filter(x=>x.date===key),crew=DATA.shifts.filter(x=>x.date===key);let items=[];if(!c.out&&p.length){const by=new Map();p.forEach(x=>{const label=[x.part,x.dayType].filter(Boolean).join(' · ')||x.activity||'Program';if(!by.has(label))by.set(label,{label,type:eventType(x.dayType,x.activity),start:x.start||'',end:x.end||''})});items=[...by.values()]}else if(!c.out&&crew.length){const a=crew[0].activity||crew[0].task||'Produktionsdag';items=[{label:a,type:eventType('',a),start:crew.map(x=>x.start).filter(Boolean).sort()[0]||'',end:crew.map(x=>x.end).filter(Boolean).sort().slice(-1)[0]||''}]}return `<div class="cal-cell${c.out?' out':''}${key===DATA.today?' today':''}"><div class="cal-num">${c.date.getDate()}</div><div class="cal-items">${items.map(x=>`<button class="cal-item ${x.type}" data-date="${key}">${esc(x.label)}${x.start?`<small>${esc(x.start)}${x.end?' · '+esc(x.end):''}</small>`:''}</button>`).join('')}</div></div>`};$('#calendarContent').innerHTML=`<div class="cal-shell"><div class="cal-head"><strong>SEPTEMBER 2026</strong><div class="cal-legend"><span class="leg-pr">Prøve</span><span class="leg-op">Optagelse</span><span class="leg-other">Andet</span></div></div><div class="cal-week"><div>MAN</div><div>TIR</div><div>ONS</div><div>TOR</div><div>FRE</div><div>LØR</div><div>SØN</div></div><div class="cal-grid">${cells.map(html).join('')}</div></div>`;$$('.cal-item').forEach(b=>b.addEventListener('click',()=>{showPage('all');renderAll(b.dataset.date)}))}
function parseCsv(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(v);v='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);v='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];continue}v+=c}if(v||row.length){row.push(v);if(row.some(x=>String(x).trim()!==''))rows.push(row)}return rows}
function contactGroup(role){const r=String(role||'').toLowerCase();if(/^spíri$/i.test(String(role||'').trim()))return'Spírar';if(/klip|color|post/.test(r))return'Post';if(/ljóð|lyd|ccu|friisframe/.test(r))return'Lyd';if(/sang|tónleikari|kapell|orkester|musik/.test(r))return'Musik';if(/foto|fotograf|kamera|ljós|scenografi/.test(r))return'Foto / lys';if(/framleið|producer|produktion|tilrettel|samskip|line producer|ábyrgd|marknað/.test(r))return'Produktion';return'Øvrige'}
function initials(name){return String(name||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function groupIcon(g){return g==='Produktion'?'●':g==='Foto / lys'?'◉':g==='Lyd'?'≋':g==='Musik'?'♪':g==='Spírar'?'✦':g==='Post'?'✂':'•'}
async function renderPeople(){const box=$('#peopleContent');box.innerHTML='<div class="empty">Indlæser kontakter…</div>';try{const u=`https://docs.google.com/spreadsheets/d/${MASTER}/gviz/tq?tqx=out:csv&sheet=PERSONALE&range=A4:G60&headers=0&_=${Date.now()}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Kunne ikke hente PERSONALE');let rows=parseCsv(await r.text());if(rows[0]&&String(rows[0][0]).trim()==='ID')rows=rows.slice(1);const ppl=rows.map(x=>({name:String(x[2]||'').trim(),role:String(x[3]||'').trim(),phone:String(x[5]||'').trim(),email:String(x[6]||'').trim()})).filter(x=>x.name&&!/^stjerne\b/i.test(x.name)&&!/stjørna|stjerne/i.test(x.role)&&!/^mangler person/i.test(x.name)).map(x=>({...x,name:x.role.toLowerCase()==='spíri'?x.name.split(/\s+/)[0]:x.name,group:contactGroup(x.role)}));const groups={};ppl.forEach(x=>(groups[x.group]??=[]).push(x));const order=['Produktion','Foto / lys','Lyd','Musik','Spírar','Post','Øvrige'];box.innerHTML=ppl.length?`<div class="people-groups">${order.filter(g=>groups[g]?.length).map(g=>`<section class="people-group" data-group="${esc(g)}"><div class="people-head"><div class="people-dot">${groupIcon(g)}</div><h3>${esc(g)}</h3></div><div class="people-grid">${groups[g].sort((a,b)=>a.name.localeCompare(b.name,'da')).map(x=>{const ph=x.phone?x.phone.split(/\s*·\s*/).map(p=>`<a href="tel:${esc(p.replace(/[^\d+]/g,''))}">☎ ${esc(p)}</a>`).join(''):'';const em=x.email?x.email.split(/\s*·\s*/).map(e=>`<a href="mailto:${esc(e)}">✉ ${esc(e)}</a>`).join(''):'';return `<article class="contact-card"><div class="contact-top"><div class="contact-avatar">${esc(initials(x.name))}</div><div class="contact-main"><div class="contact-name">${esc(x.name)}</div><div class="contact-role">${esc(x.role||'Funktion ikke angivet')}</div></div></div><div class="contact-links">${ph}${em}${!ph&&!em?'<span class="contact-empty">Kontaktinfo mangler</span>':''}</div></article>`}).join('')}</div></section>`).join('')}</div>`:'<div class="empty">Ingen personer fundet.</div>'}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function parseSunset(v){const s=String(v||'').trim();if(!s)return null;let m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?:\s+(\d{1,2}):(\d{2}))?$/);if(m){let year=m[3]?Number(m[3]):2026;if(year<100)year+=2000;const d=new Date(year,Number(m[2])-1,Number(m[1]),m[4]?Number(m[4]):23,m[5]?Number(m[5]):59,59);return isNaN(d)?null:d}m=s.match(/^(\d{1,2})[.-](\d{1,2})[.-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?$/);if(m){const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),m[4]?Number(m[4]):23,m[5]?Number(m[5]):59,59);return isNaN(d)?null:d}const d=new Date(s);return isNaN(d)?null:d}
function messageClass(type){const t=String(type||'').toLowerCase();if(t.includes('vigtigt'))return'important';if(t.includes('i dag'))return'today';return'info'}
function isMessageActive(m){if(String(m.status||'').trim().toLowerCase()!=='aktiv')return false;const sunset=parseSunset(m.sunset);return !sunset||sunset>=new Date()}
async function loadMessages(){try{const u=`https://docs.google.com/spreadsheets/d/${MASTER}/gviz/tq?tqx=out:csv&sheet=BESKEDER&range=A1:F300&headers=0&_=${Date.now()}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Kunne ikke hente BESKEDER');let rows=parseCsv(await r.text());if(rows[0]&&String(rows[0][0]).trim()==='Status')rows=rows.slice(1);MESSAGES=rows.map((x,i)=>({id:i+1,status:String(x[0]||'').trim(),type:String(x[1]||'').trim(),audience:String(x[2]||'').trim(),title:String(x[3]||'').trim(),text:String(x[4]||'').trim(),sunset:String(x[5]||'').trim()})).filter(m=>m.title||m.text);renderMessages();renderHomeMessages()}catch(e){MESSAGES=[];$('#messagesContent').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderMessages(){const active=MESSAGES.filter(isMessageActive);$('#messagesContent').innerHTML=active.length?active.map(m=>{const c=messageClass(m.type);return `<article class="message-card ${c}"><div class="message-top"><span class="message-type">${esc(m.type||'Info')}</span><span class="message-audience">${esc(m.audience||'Alle')}</span></div><div class="message-title">${esc(m.title||'Besked')}</div><div class="message-text">${esc(m.text)}</div>${m.sunset?`<div class="message-sunset">Vises til ${esc(m.sunset)}</div>`:''}</article>`}).join(''):'<div class="simple"><div class="empty">Ingen aktive beskeder.</div></div>'}
function renderHomeMessages(){const active=MESSAGES.filter(isMessageActive).slice(0,3);$('#homeMessages').innerHTML=active.length?active.map(m=>`<div class="home-message"><strong>${esc(m.title||m.type||'Besked')}</strong><small>${esc(m.type||'Info')} · ${esc(m.audience||'Alle')}</small></div>`).join(''):''}
async function loadData(){try{const r=await fetch('/.netlify/functions/portal-data',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Kunne ikke hente data');DATA=j;const sel=$('#nameSelect');sel.innerHTML='<option value="">VÆLG DIT NAVN</option>'+j.people.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');const saved=localStorage.getItem('hoydalarName');if(saved&&j.people.includes(saved))sel.value=saved;sel.addEventListener('change',()=>{localStorage.setItem('hoydalarName',sel.value);renderMine();renderHome();if(sel.value)showPage('mine')});renderHome();renderAll();renderCalendar();renderPeople();$('#syncTag').textContent='LIVE · OPDATERET';if(sel.value)renderMine()}catch(e){$('#nameSelect').innerHTML='<option>DATAFORBINDELSE MANGLER</option>';$('#syncTag').textContent='IKKE FORBUNDET';$('#myNext').innerHTML=`<div class="empty">${esc(e.message)}</div>`;$('#nextDay').innerHTML='<div class="empty">Dataforbindelsen er ikke klar.</div>';$('#allContent').innerHTML='<div class="empty">Dataforbindelsen er ikke klar.</div>';$('#calendarContent').innerHTML='<div class="empty">Dataforbindelsen er ikke klar.</div>'}}
Promise.all([loadData(),loadMessages()]);
</script>
